name: iOS store listing

# Uploads the App Store listing (texts, URLs, categories, screenshots, age
# rating, review notes) with fastlane deliver. Never uploads a binary and
# never submits for review.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    name: Upload the App Store listing
    runs-on: ubuntu-latest
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install fastlane
        run: gem install fastlane --no-document && fastlane --version

      - name: API key
        run: |
          umask 077
          ruby -rjson -e 'puts JSON.generate({key_id: ENV["KEY_ID"], issuer_id: ENV["ISSUER"], key: ENV["KEY_P8"], is_key_content_base64: true, in_house: false})' > "$RUNNER_TEMP/asc_key.json"

      - name: Listing files (iOS only)
        env:
          REVIEW_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
        run: |
          META="$RUNNER_TEMP/metadata"
          mkdir -p "$META"
          cp -R fastlane/metadata/it fastlane/metadata/en-US fastlane/metadata/review_information "$META/"
          cp fastlane/metadata/*.txt "$META/"
          # "What's New" is not accepted on the first version.
          rm -f "$META"/*/release_notes.txt
          # Apple requires a contact phone with the review information: kept in a
          # secret, never in the repository. Without it the review notes are skipped.
          if [ -n "$REVIEW_PHONE" ]; then
            printf '%s' "$REVIEW_PHONE" > "$META/review_information/phone_number.txt"
          else
            echo "No APP_REVIEW_CONTACT_PHONE secret: review information not uploaded."
            rm -rf "$META/review_information"
          fi
          find "$META" -type f | sort

      - name: Deliver
        env:
          ASC_KEY_JSON: ${{ runner.temp }}/asc_key.json
          LISTING_METADATA: ${{ runner.temp }}/metadata
          FASTLANE_OPT_OUT_USAGE: 'YES'
          FASTLANE_SKIP_UPDATE_CHECK: 'YES'
        run: fastlane ios listing

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.json"
